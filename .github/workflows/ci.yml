name: CI

on:
  push:
    branches: [ main, develop ]
    tags:
      - 'v*.*.*'
  pull_request:

jobs:
  golangci:
    name: Lint code
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Read pinned golangci-lint version
        id: lint-version
        run: echo "version=$(sed -n 's/^GOLANGCI_LINT_VERSION=//p' Makefile)" >> "$GITHUB_OUTPUT"

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: ${{ steps.lint-version.outputs.version }}

  unit-tests:
    name: Run unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Run unit tests
        run: |
          go test -v -race -coverprofile=coverage-unit.out -covermode=atomic ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage-unit.out
          flags: unittests

  integration-tests:
    name: Run integration tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install Atlas CLI
        run: curl -sSf https://atlasgo.sh | sh

      - name: Run integration tests
        run: |
          go test -v -p 1 -tags=integration -coverprofile=coverage-integration.out ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage-integration.out
          flags: integration

  e2e-tests:
    name: Run e2e gateway tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Run e2e gateway stand
        run: make test-e2e

  govulncheck:
    name: Scan dependencies for vulnerabilities
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Run govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: stable

  gosec:
    name: Static security analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Same pinned image and flags as local runs; version lives in the Makefile.
      - name: Run gosec
        run: make sec

  proto-check:
    name: Check proto contract for breaking changes
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read

    steps:
      # buf reads the local .git only; no token needs to reach its container.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # Same pinned image as local runs; version lives in the Makefile.
      - name: Run buf lint and breaking
        env:
          BASE_REF: ${{ github.base_ref }}
        run: make proto-check BUF_AGAINST=".git#ref=origin/$BASE_REF"

  gitleaks:
    name: Scan for committed secrets
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
