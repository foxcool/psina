name: CI

on:
  push:
    branches: [ main, develop ]
    tags:
      - 'v*.*.*'
  pull_request:

jobs:
  golangci:
    name: Lint code
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  unit-tests:
    name: Run unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Run unit tests
        run: |
          go test -v -race -coverprofile=coverage-unit.out -covermode=atomic ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage-unit.out
          flags: unittests

  integration-tests:
    name: Run integration tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install Atlas CLI
        run: curl -sSf https://atlasgo.sh | sh

      - name: Run integration tests
        run: |
          go test -v -p 1 -tags=integration -coverprofile=coverage-integration.out ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage-integration.out
          flags: integration

  e2e-tests:
    name: Run e2e gateway tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Run e2e gateway stand
        run: make test-e2e

  govulncheck:
    name: Scan dependencies for vulnerabilities
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Run govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: stable

  gosec:
    name: Static security analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run gosec
        uses: securego/gosec@master
        with:
          args: -exclude-generated ./...

  gitleaks:
    name: Scan for committed secrets
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  security-review:
    name: Claude security review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2

      - uses: anthropics/claude-code-security-review@main
        with:
          comment-pr: true
          claude-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Without this the action caches a marker under a key whose
          # restore-keys prefix omits the SHA, so it matches any commit on the
          # PR: the review runs once and silently no-ops on everything pushed
          # afterwards. We would rather re-review than never review a commit.
          run-every-commit: true

      # The action reports success even when the audit itself crashed: on
      # failure it writes {"error": ...} with no "findings" key, and its
      # `jq '.findings // []'` turns that into an empty findings list. A
      # broken audit is then indistinguishable from a clean diff. Fail here
      # so a review that never ran can never be reported as passing.
      - name: Fail if the audit did not actually run
        if: always()
        run: |
          results=claudecode-results.json
          if [ ! -f "$results" ]; then
            echo "::error::$results missing — the security audit did not produce results."
            exit 1
          fi
          if jq -e 'has("error")' "$results" >/dev/null 2>&1; then
            echo "::error::Security audit failed to run; findings were NOT collected."
            jq -r '.error' "$results"
            exit 1
          fi
          echo "Audit ran; findings: $(jq -r '.findings | if . == null then 0 else length end' "$results")"

